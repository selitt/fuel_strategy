[project]
name = "fuel-web-api"
version = "1.1.0"
description = "HTTP/UI bridge for the existing Kosmo API contracts; no engine changes"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.128.2",
    "pydantic==2.13.4",
    "uvicorn==0.48.0",
    "python-multipart==0.0.29",
    "openpyxl==3.1.5",
    "PyYAML==6.0.3",
    "xlrd==2.0.2",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.0.2",
    "jsonschema==4.26.0",
    "xlwt==1.3.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

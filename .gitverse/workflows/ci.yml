name: Project CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  integrity-contracts:
    name: Integrity and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository and references
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements/dev.txt
      - name: Check workspace and reference data
        run: python -S tools/workspace.py check
      - name: Check published OpenAPI
        run: python tools/export_openapi.py --check
      - name: Check generated frontend API types
        run: python tools/generate_frontend_types.py --check

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository and references
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements/dev.txt
      - name: Run Python test suite
        run: python -m pytest -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository and references
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Run frontend tests
        run: npm --prefix frontend test
      - name: Build production frontend
        run: npm --prefix frontend run build
      - name: Verify supplied portable frontend
        run: python tools/verify_prebuilt.py

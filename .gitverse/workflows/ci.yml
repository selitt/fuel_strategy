name: Project CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  integrity-contracts:
    name: Integrity and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements/dev.txt
      - name: Check published OpenAPI
        run: python tools/export_openapi.py --check
      - name: Check generated frontend API types
        run: python tools/generate_frontend_types.py --check

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements/dev.txt
      - name: Run Python test suite
        run: python -m pytest -q --cov=src.app --cov-report=term-missing

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Run frontend tests
        run: npm --prefix frontend test -- --coverage
      - name: Build production frontend
        run: npm --prefix frontend run build

  public-browser-smoke:
    name: Public browser smoke and delivery config
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/browser.txt
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        run: python -m pip install -r requirements/browser.txt
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Build production frontend
        run: npm --prefix frontend run build
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Check Compose configuration
        run: docker compose --env-file docker/.env.example -f docker/compose.yaml config --quiet
      - name: Run authenticated public browser smoke
        run: python tests/web/public_smoke.py
      - name: Upload browser smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-browser-smoke
          path: frontend/test-results/public-smoke
          if-no-files-found: error

name: Project CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  integrity-contracts:
    name: Integrity and contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository and references
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements/dev.txt
      - name: Check workspace and reference data
        run: python -S tools/workspace.py check
      - name: Check published OpenAPI
        run: python tools/export_openapi.py --check
      - name: Check generated frontend API types
        run: python tools/generate_frontend_types.py --check

  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository and references
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - name: Install Python dependencies
        run: python -m pip install -r requirements/dev.txt
      - name: Run Python test suite
        run: python -m pytest -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository and references
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.16.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci
      - name: Run frontend tests
        run: npm --prefix frontend test
      - name: Build production frontend
        run: npm --prefix frontend run build
      - name: Verify supplied portable frontend
        run: python tools/verify_prebuilt.py
      - name: Save production frontend
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  server-browser:
    name: Docker server and Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - integrity-contracts
      - python-tests
      - frontend
    env:
      COMPOSE_PROJECT_NAME: fuel-ci
      FUEL_BIND_HOST: 127.0.0.1
      FUEL_WEB_PORT: "18080"
    steps:
      - name: Check out repository and references
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Restore production frontend
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements/browser.txt
      - name: Install browser-test dependencies
        run: python -m pip install -r requirements/browser.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Validate Docker Compose
        run: docker compose --env-file docker/.env.example -f docker/compose.yaml config --quiet
      - name: Build and start Docker service
        run: docker compose --env-file docker/.env.example -f docker/compose.yaml up --build -d --wait
      - name: Verify deployed server
        run: python tests/web/deployment_smoke.py --base-url http://127.0.0.1:18080 --artifacts artifacts/deployment
      - name: Run current Chromium UI smoke
        run: python tests/web/daily_smoke.py --site frontend/dist --artifacts artifacts/browser
      - name: Collect Docker diagnostics
        if: always()
        run: |
          mkdir -p artifacts/docker
          docker compose --env-file docker/.env.example -f docker/compose.yaml ps > artifacts/docker/ps.txt 2>&1 || true
          docker compose --env-file docker/.env.example -f docker/compose.yaml logs --no-color > artifacts/docker/logs.txt 2>&1 || true
      - name: Save server and browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-browser-artifacts
          path: artifacts
          retention-days: 7
      - name: Remove temporary Docker resources
        if: always()
        run: docker compose --env-file docker/.env.example -f docker/compose.yaml down -v --remove-orphans
